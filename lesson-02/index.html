<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שיעור 2 — שאלות | הנדסת תוכנה י"א</title>
<style>
  :root { --ink:#1e1e1e; --muted:#5b6270; --line:#d9dde4; --bg:#f6f7f9; --card:#fff;
          --accent:#2c63b5; --accent-bg:#e5eefb; --ok:#2f8f4e; --warn:#b5462c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Assistant","Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.55; }
  header { background:#232d46; color:#fff; padding:22px 18px 18px; }
  header h1 { margin:0 0 4px; font-size:1.45rem; }
  header p { margin:0; opacity:.85; }
  main { max-width:760px; margin:0 auto; padding:18px 14px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  label.q { display:block; font-weight:700; margin-bottom:8px; }
  .num { display:inline-block; min-width:1.8em; height:1.8em; line-height:1.8em; text-align:center; border-radius:50%;
         background:var(--accent-bg); color:var(--accent); margin-left:6px; font-size:.9rem; }
  textarea, input[type=text] { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  textarea { min-height:84px; resize:vertical; }
  textarea:focus, input:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  input.ltr { direction:ltr; text-align:left; }
  .meta { display:flex; justify-content:space-between; font-size:.85rem; color:var(--muted); margin-top:4px; }
  .meta .bad { color:var(--warn); }
  .meta .good { color:var(--ok); }
  .hint { font-size:.9rem; color:var(--muted); margin:6px 0 0; }
  code { direction:ltr; unicode-bidi:embed; background:#eef0f4; padding:1px 5px; border-radius:4px; font-size:.9em; }
  button { font:inherit; font-weight:700; border:0; border-radius:10px; padding:14px 18px; cursor:pointer; width:100%;
           background:var(--accent); color:#fff; font-size:1.1rem; }
  button:disabled { background:#9aa6b8; cursor:not-allowed; }
  .status { margin-top:12px; padding:12px; border-radius:8px; display:none; }
  .status.show { display:block; }
  .status.err { background:#fbe9e5; color:var(--warn); }
  .status.info { background:var(--accent-bg); color:#1d3f75; }
  ol.steps { margin:8px 0 0; padding-inline-start:20px; }
</style>
</head>
<body>
<header>
  <h1>📝 שיעור 2 — שאלות על מבנה הפרויקט ו-Gradle</h1>
  <p>ממלאים כאן, לוחצים "שלח", ו-GitHub שומר את התשובות בריפו שלכם. לא עורכים שום קובץ. שאלות 7–8 הן בונוס.</p>
</header>
<main>
  <div class="card">
    <label class="q" for="user">שם המשתמש שלכם ב-GitHub</label>
    <input id="user" class="ltr" type="text" autocomplete="username" spellcheck="false" placeholder="your-username">
    <p class="hint">הריפו שלכם: <code id="repoPreview">—</code></p>
  </div>

  <form id="form" novalidate></form>

  <div class="card">
    <button id="send" type="button">שלח ל-GitHub ←</button>
    <div id="status" class="status"></div>
    <p class="hint">אחרי הלחיצה ייפתח דף <b>New issue</b> בריפו שלכם. לוחצים <b>Create</b> — וזהו.
      רוצים לשנות תשובה? ממלאים שוב. ההגשה האחרונה קובעת.</p>
  </div>
</main>

<script>
// ---- config (per lesson) -------------------------------------------------
const ORG = "Aloney-Yitzchak";
const REPO_PATTERN = "ap-cs-11th-lesson-02-gradle-{user}";   // Classroom 50: <classroom>-<assignment>-<username>
const ISSUE_TITLE = "📝 תשובות שיעור 2";
const MIN_WORDS = 3, MAX_CHARS = 400, MAX_URL = 7600;
const QUESTIONS = [
  {id:"q1", bonus:false, text:"בחלון Project (תצוגת Android) יש 3 תיקיות ראשיות. מה השמות שלהן ומה יש בכל אחת?"},
  {id:"q2", bonus:false, text:"מה התפקיד של הקובץ AndroidManifest.xml? (2–3 משפטים)"},
  {id:"q3", bonus:false, text:"רשמו 3 תיקיות משנה שנמצאות בתוך res, ומה נמצא בכל אחת."},
  {id:"q4", bonus:false, text:"מה Gson עושה ולמה זה שימושי? תנו דוגמה מאפליקציה אמיתית (למשל WhatsApp או Instagram)."},
  {id:"q5", bonus:false, text:"מה קורה כשלוחצים Sync Now? ומה יקרה אם לא נלחץ עליו אחרי שהוספנו dependency?"},
  {id:"q6", bonus:false, text:"מה ההבדל בין build.gradle (Project) לבין build.gradle (Module: app)? ולמה מפרידים בין קוד (java) למשאבים (res)?"},
  {id:"q7", bonus:true, text:"בונוס — חיבור לפרויקט שלך: איזו ספרייה (dependency) נוספת האפליקציה שלך כנראה תצטרך, ומה היא עושה?"},
  {id:"q8", bonus:true, text:"בונוס: מה ההבדל בין minSdk לבין targetSdk?"},
];

// ---- storage (best effort; never required) --------------------------------
const store = {
  get(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
};
const KEY = "lesson02:";

// ---- build form -------------------------------------------------------------
const form = document.getElementById("form");
QUESTIONS.forEach((q, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <label class="q" for="${q.id}"><span class="num">${i+1}</span>${q.text}</label>
    <textarea id="${q.id}" maxlength="${MAX_CHARS}" placeholder="${q.bonus ? 'לא חובה…' : 'כתבו כאן…'}"></textarea>
    <div class="meta"><span class="words"></span><span class="chars"></span></div>`;
  form.appendChild(card);
  const ta = card.querySelector("textarea");
  ta.value = store.get(KEY + q.id);
  ta.addEventListener("input", () => { store.set(KEY + q.id, ta.value); updateMeta(ta); });
  updateMeta(ta);
});

function words(s){ return s.trim().split(/\s+/).filter(Boolean).length; }
function updateMeta(ta){
  const meta = ta.nextElementSibling, n = words(ta.value);
  const w = meta.querySelector(".words");
  w.textContent = n >= MIN_WORDS ? "✓ מספיק" : `לפחות ${MIN_WORDS} מילים (${n})`;
  w.className = "words " + (n >= MIN_WORDS ? "good" : (n ? "bad" : ""));
  meta.querySelector(".chars").textContent = `${ta.value.length}/${MAX_CHARS}`;
}

// ---- username → repo ----------------------------------------------------------
const user = document.getElementById("user");
const preview = document.getElementById("repoPreview");
user.value = store.get(KEY + "user");
function cleanUser(){ return user.value.trim().replace(/^@/, "").replace(/^https?:\/\/github\.com\//i, "").split("/")[0]; }
function repoName(){ const u = cleanUser().toLowerCase(); return u ? REPO_PATTERN.replace("{user}", u) : ""; }
function updatePreview(){ preview.textContent = repoName() ? `${ORG}/${repoName()}` : "—"; }
user.addEventListener("input", () => { store.set(KEY + "user", cleanUser()); updatePreview(); });
updatePreview();

// ---- submit -------------------------------------------------------------------
const status = document.getElementById("status");
function show(kind, html){ status.className = "status show " + kind; status.innerHTML = html; }

function buildBody(){
  // Markers <!-- qN --> are what the autograder reads. Keep question text out to save URL length.
  return QUESTIONS.map((q, i) =>
    `### שאלה ${i+1}\n<!-- ${q.id} -->\n${document.getElementById(q.id).value.trim()}\n`).join("\n");
}

document.getElementById("send").addEventListener("click", async () => {
  if (!/^[A-Za-z0-9-]{1,39}$/.test(cleanUser())) {
    show("err", "כתבו את שם המשתמש שלכם ב-GitHub (אותיות באנגלית, מספרים ומקפים בלבד)."); user.focus(); return;
  }
  const missing = QUESTIONS.filter(q => !q.bonus && words(document.getElementById(q.id).value) < MIN_WORDS)
                           .map(q => QUESTIONS.indexOf(q) + 1);
  if (missing.length && !confirm(`בשאלות ${missing.join(", ")} יש פחות מ-${MIN_WORDS} מילים — הן לא יקבלו נקודות.\nלשלוח בכל זאת?`)) return;

  const body = buildBody();
  const base = `https://github.com/${ORG}/${repoName()}/issues/new`;
  let url = `${base}?title=${encodeURIComponent(ISSUE_TITLE)}&body=${encodeURIComponent(body)}`;

  if (url.length > MAX_URL) {
    // Too long for a link: copy the answers and open an issue with the title only.
    let copied = false;
    try { await navigator.clipboard.writeText(body); copied = true; } catch(e) {}
    url = `${base}?title=${encodeURIComponent(ISSUE_TITLE)}`;
    show("info", copied
      ? "התשובות ארוכות, אז העתקנו אותן ללוח. בדף שנפתח: לחצו בתיבה הגדולה → <b>Ctrl+V</b> → <b>Create</b>."
      : "התשובות ארוכות מדי לשליחה אוטומטית. קצרו קצת את התשובות ונסו שוב.");
    if (!copied) return;
  } else {
    show("info", `<b>כמעט סיימתם!</b><ol class="steps"><li>בדף שנפתח לחצו <b>Create</b>.</li>
      <li>אחרי דקה תופיע שם תגובה ✅ — התשובות נשמרו.</li>
      <li>ב-Android Studio עשו <b>Git → Pull</b> לפני ה-Push הבא.</li></ol>
      לא נפתח דף? <a href="${url}" target="_blank" rel="noopener">לחצו כאן</a>.<br>
      מופיע "404"? בדקו את שם המשתמש, ושקיבלתם את המשימה ב-Classroom 50.`);
  }
  window.open(url, "_blank", "noopener");
});
</script>
</body>
</html>
